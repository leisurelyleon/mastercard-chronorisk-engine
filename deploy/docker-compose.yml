version: '3.8'

services:
  # The Go Settlement Orchestrator
  chronorisk_daemon:
    build: 
      context: ../settlement_orchestrator
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=debug
    depends_on:
      - kafka

  # The C++ Quantitative Risk Engine
  quant_engine:
    build:
      context: ../quant_liquidity_engine
    deploy:
      resources:
        limits:
          cpus: '4' # Assigning dedicated cores for SIMD math

  # Mock Kafka for local testing
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
